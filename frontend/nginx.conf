server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type text/plain;
        return 200 'frontend ok';
    }

    location /products/ {
        proxy_pass http://product:8000/;
    }

    location /inventory/ {
        proxy_pass http://inventory:8000/;
    }

    location /orders/ {
        proxy_pass http://orders:8000/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
