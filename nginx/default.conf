server {
    listen 80;

    location = /health {
        default_type text/plain;
        return 200 'gateway ok';
    }

    location /products/ {
        proxy_pass http://product:8000/;
    }

    location /inventory/ {
        proxy_pass http://inventory:8000/;
    }

    location /orders/ {
        proxy_pass http://orders:8000/;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}
